name: Check PRC exam results

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check official PRC feed and send new-result alerts
        env:
          CRON_SECRET: ${{ secrets.BOARD_EXAMTRACKER_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret BOARD_EXAMTRACKER_CRON_SECRET" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 55 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: BoardExamTracker scheduled result checker" \
            "https://www.boardexamtracker.com/api/cron/check-results"
