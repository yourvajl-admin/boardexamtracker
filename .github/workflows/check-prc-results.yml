name: Automatic PRC exam result check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      verified_result_urls:
        description: 'Optional JSON array of already verified PRC result article URLs'
        required: false
        default: '[]'
        type: string

permissions: {}

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check official PRC feed and send new-result alerts
        env:
          CRON_SECRET: ${{ secrets.BOARD_EXAMTRACKER_CRON_SECRET }}
          VERIFIED_RESULT_URLS: ${{ inputs.verified_result_urls }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret BOARD_EXAMTRACKER_CRON_SECRET" >&2
            exit 1
          fi
          node src/check-results.js
