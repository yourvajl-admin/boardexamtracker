name: Check PRC exam results

on:
  push:
    branches:
      - main
  schedule:
    # Offset away from the top-of-hour traffic spike that can delay scheduled runs.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check-results:
    # Use a separate GitHub-hosted network path to reach the official PRC page.
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check official PRC feed and send new-result alerts
        env:
          CRON_SECRET: ${{ secrets.BOARD_EXAMTRACKER_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret BOARD_EXAMTRACKER_CRON_SECRET" >&2
            exit 1
          fi
          node src/check-results.js
